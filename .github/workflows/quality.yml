name: Clojure quality gate
on: [push, pull_request]
jobs:
  clojure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.0.1530
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/build-clojure.sh
      - run: clojure -M:integration
        working-directory: backend
      - run: clojure -M:capacity
        working-directory: backend
      - run: PG_BIN="$(pg_config --bindir)" bash scripts/clojure/postgres-migration-test.sh
      - run: python3 scripts/clojure/export_sqlite_test.py
      - run: npx --yes @puppeteer/browsers install chrome@stable --path /tmp/ecc-chrome
      - name: Browser checks
        shell: bash
        run: |
          chrome_path=$(find /tmp/ecc-chrome -type f -name chrome -print -quit)
          CHROME_PATH="$chrome_path" node --test scripts/clojure/browser.test.cjs
      - name: Live XTDB browser acceptance
        shell: bash
        run: |
          chrome_path=$(find /tmp/ecc-chrome -type f -name chrome -print -quit)
          cd backend
          CHROME_PATH="$chrome_path" clojure -M:acceptance
      - run: docker build --file Dockerfile --tag ecc-crm:checked .
      - name: Scan replacement image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ecc-crm:checked
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln
