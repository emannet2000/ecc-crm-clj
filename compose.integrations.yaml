# Optional provider worker. Use with compose.yaml and configure private env files.
services:
  api:
    environment:
      INTEGRATIONS_ENABLED: ${INTEGRATIONS_ENABLED:-}
  integrations:
    image: ecc-crm-integrations:release
    build:
      context: ./api
      dockerfile: deploy/Dockerfile.workers
    command: [python3, -u, scripts/integration_worker.py]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    env_file: [./integrations.env]
    environment:
      DATABASE_PATH: /data/ecc-crm.sqlite3
    volumes:
      - sqlite_data:/data
      - integration_secrets:/var/lib/ecc/secrets
    depends_on:
      api: {condition: service_healthy}
volumes:
  integration_secrets:
