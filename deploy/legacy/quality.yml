name: Quality gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ecc_test
          POSTGRES_USER: ecc_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecc_test -d ecc_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database headers and PostgreSQL 17 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev postgresql-client-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - run: npm install -g elm@0.19.1-6
      - run: python3 -m pip install -r api/scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            ~/.elm
          key: dependencies-${{ runner.os }}-${{ hashFiles('api/*.cabal', 'api/cabal.project.freeze', 'api/web/elm.json') }}
      - run: cabal update
        working-directory: api
      - run: cabal build all
        working-directory: api
      - uses: actions/checkout@v4
        with:
          repository: haskell/security-advisories
          path: .security-advisories
      - run: python3 scripts/audit_haskell.py api/dist-newstyle/cache/plan.json .security-advisories/advisories
      - name: Run the current API release gate
        run: bash scripts/check.sh
        working-directory: api
        env:
          ECC_TEST_DATABASE_URL: postgresql://ecc_test:disposable-ci-password@localhost:5432/ecc_test?sslmode=disable
          PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
          PG_RESTORE_BIN: /usr/lib/postgresql/17/bin/pg_restore
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: /tmp/ecc-*.png
          if-no-files-found: ignore
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_release.py
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.release.yaml -f compose.offhost.yaml config --quiet
        env:
          RESTIC_REPOSITORY: s3:https://backup.example/test
          RESTIC_PASSWORD_PATH: /tmp/example-restic-password
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-identities
          path: release-images.json
      - name: Scan api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecc-crm-api:release
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln
          ignore-unfixed: false
      - name: Scan mail image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecc-crm-mail:release
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln
          ignore-unfixed: false
      - name: Scan integrations image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecc-crm-integrations:release
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln
          ignore-unfixed: false
      - name: Scan backup image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecc-crm-backup:release
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln
          ignore-unfixed: false
      - name: Scan antivirus image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecc-crm-clamav:release
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln
          ignore-unfixed: false
      - name: Scan proxy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln
          ignore-unfixed: false
